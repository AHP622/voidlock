name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Tag must match the app version (otherwise the app would update in a loop)
        shell: pwsh
        run: |
          $v = (Select-String -Path voidlock/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "Tag ${{ github.ref_name }} does not match __version__ $v"; exit 1 }
      - name: Logic tests (informational)
        continue-on-error: true
        run: python tests/logic_test.py
      - run: python -m PyInstaller --noconsole --onefile --name VoidLock --icon assets/icon.ico --add-data "assets;assets" main.py
      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/VoidLock.exe -Algorithm SHA256).Hash.ToLower()
          "$h  VoidLock.exe" | Out-File -Encoding ascii dist/VoidLock.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VoidLock.exe
            dist/VoidLock.exe.sha256
          generate_release_notes: true
